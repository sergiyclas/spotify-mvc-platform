[project]
name = "spotify-mvc-platform"
version = "1.0.0"
description = "Music platform management system built on a layered MVC architecture"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Serhiy Dzen"}
]

dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.40",
    "python-multipart>=0.0.20",
    "PyYAML>=6.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.0.0",
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14",
]
